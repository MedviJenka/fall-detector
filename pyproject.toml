[project]
name = "fall-detector"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "crewai==1.15.22",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "opencv-python>=5.0.0.93",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
