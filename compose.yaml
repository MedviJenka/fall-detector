name: fall-detector

services:
  app:
    image: fall-detector:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      EVENT_DATA_DIR: /app/data
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - fall-detector-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 3
    # Linux hosts can pass a V4L2 webcam through by uncommenting these lines.
    # Docker Desktop for Windows does not expose host webcams to Linux containers.
    # devices:
    #   - "${CAMERA_DEVICE:-/dev/video0}:/dev/video0"

volumes:
  fall-detector-data:
